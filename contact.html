<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
         <center><h1 style="color: chartreuse;">Contact</h1></center>
   <nav>
        
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
    </header>
        <main>
            <hr>
            <h2>Customer registration and order Form</h2>
            <hr>
            <form action="#" method="get"></form>
            <label for="fullname">fullname : </label>

            <input type="text" value="fullname"
            id = "fullname" placeholder= "Enter fullname"
            required
            >
            <br><br>
             
            <label for="Email">Email Address</label>
            <input type="text" value="Email"
            id="email" placeholder="Enter Email Address"
            required
            >
            <br><br>

            <label for="Password">Password</label>
            <input type="Password" value="Password"
            id="Password" placeholder="Enter Password"
            required
            >
            <br><br>

             <label for="phone">Phone Number :</label>
            <input type="tel" name="phone"
            id="Phone" placeholder="Enter Phone number"
            required
            >
            <br><br>

            <label for="quantity">Quantity</label>
            <input type="number" name="quantity" id="quantity"
            placeholder="Enter Quantity"
            required
            ><span>*</span>
            <br><br>
            <label for="ddate">Delivery Date</label>
            <input type="date" name="ddate" id="ddate"
            placeholder="Select Date">
            <br><br>
            <label for="food">Select Food Item :</label>
            <select name="food" id="food">
                <option>Select Food</option>
                <option value="veg pizza">Veg Pizza</option>
                <option value="Chese Burger">Cheese Burger</option>
                <option value="White Sauce Pasta">White Sauce Pasta</option>
                <option value="Veg Grilled Sandwich">Veg Grilled Sandwich</option>
                <option value="Chocolate Brownie">Chocolate Brownie</option>
            </select><br><br>

            <h3>Payment Method</h3>
            <input type="radio" name="payment" id="cash">
            <label for="cash">Cash</label>

            <input type="radio" name="payment" id="card">
            <label for="card">Card</label>

            <input type="radio" name="payment" id="UPI">
            <label for="UPI">UPI</label>
            <br><br>

            <h3>Extras : </h3>
             <input type="checkbox" name="extras" id="cheese">
             <label for="cheese">Cheese</label>

             <input type="checkbox" name="extras" id="drinks">
             <label for="drinks">Drinks</label>

             <input type="checkbox" name="extras" id="Dessert">
             <label for="dessertd">Dessert</label>

             <br><br>

             <h3>Delivery Instructions</h3>
             <label for="address">Address :</label>
                <textarea name="address" id="address"
                rows="4" cols="40"
                ></textarea>
                <br><br>




            <button type="submit">Place order</button>
            <button type="reset">Clear form</button>

        </main>
        <hr>
    <br>
    <h2>
        Visit our websites

        <a href="http://www.google.com">Visit google</a>
    </p>
    <hr>
    <br><br>
</body>
</html>
